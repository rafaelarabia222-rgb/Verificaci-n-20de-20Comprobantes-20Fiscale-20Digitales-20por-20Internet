<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Verificación de Comprobantes Fiscales Digitales por Internet</title>
    
    <!-- Bootstrap CSS y fuentes oficiales -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">

    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            background-color: #ffffff;
            color: #333;

        }

            color: #555;
            margin-bottom: 20px;
        }
        .breadcrumb-container a {
            color: #333;
            text-decoration: none;
        }
        hr.red {
            border-top: 3px solid #bc955c;
            margin-top: 10px;
            margin-bottom: 20px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-text-error {
            color: #a94442;
        }
        .table > tr > th, .table > tbody > tr > th {
            background-color: #f9f9f9;
            color: #333;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <main role="main" class="container" style="padding-top: 20px; padding-bottom: 40px;">
        
        <!-- Migas de pan / Inicio -->
        <div class="breadcrumb-container">
            <span class="glyphicon glyphicon-home"></span> <a href="#">Inicio</a> &gt; <strong>Inicio</strong>
        </div>

        <!-- Logotipos Oficiales de Hacienda y SAT -->
        <div class="row" style="align-items: center; display: flex; margin-bottom: 10px;">
            <div class="col-xs-12">
                <img src="https://verificacfdi.facturaelectronica.sat.gob.mx/images/logo-shcp-sat.png" alt="Hacienda y SAT" style="max-height: 55px; height: auto;">
            </div>
        </div>

        <!-- Versión del Sistema -->
        <div class="row">
            <div class="col-xs-12">
                <p style="color: #666; font-size: 18px; margin-bottom: 25px;">Versión 4.5.1</p>
            </div>
        </div>

        <div id="cuerpo_principal">
            
            <div class="row">
                <h3 class="titulo" style="color: #333; font-weight: 700; margin-bottom: 20px; font-size: 28px;">Verificación de comprobantes fiscales digitales por internet</h3>
            </div>

            <!-- Pestañas de Navegación (Radio Buttons idénticos al SAT) -->
            <div class="row" style="margin-bottom: 15px; font-size: 16px; font-weight: bold;">
                <div class="col-md-4 col-sm-6" style="display: flex; align-items: center; gap: 10px;">
                    <input type="radio" name="tabs" id="chkFolio" checked onclick="cambiarTab('verificaFolio')" style="width: 20px; height: 20px; cursor: pointer;">
                    <label for="chkFolio" style="cursor: pointer; margin: 0;">Consulta por Folio Fiscal</label>
                </div>
                <div class="col-md-4 col-sm-6" style="display: flex; align-items: center; gap: 10px;">
                    <input type="radio" name="tabs" id="chkXml" onclick="cambiarTab('verificaXml')" style="width: 20px; height: 20px; cursor: pointer;">
                    <label for="chkXml" style="cursor: pointer; margin: 0;">Consulta por archivo XML</label>
                </div>
            </div>

            <hr class="red">

            <div id="verificaFolio" class="tab-content active">
                <p class="text-muted" style="font-size: 15px;">A través de esta opción, usted podrá verificar si el comprobante fue certificado por el SAT.</p>
                <br>
